name: Test OIDC Connection

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  test-oidc:
    runs-on: ubuntu-latest
    # NO environment - tests at repository level
    steps:
      - name: Debug context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          
      - name: Try to assume role
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: arn:aws:iam::983306392758:role/github-actions-lambda-poc-deploy
          aws-region: us-east-1
          role-session-name: test-${{ github.run_id }}
          
      - name: Verify AWS access
        run: |
          echo "Successfully assumed role!"
          aws sts get-caller-identity
          aws s3 ls s3://pwhittney-deployment-aadg6yri/ || echo "Can't list bucket (might be permissions)"
