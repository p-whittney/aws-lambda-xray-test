AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub Actions OIDC federation for this repo
  Allows the github repo to assume the IAM role for this project
  Note: AWS Account global. Set CreateOidcProvider=false for just adding roles

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub org or username that owns the repo.

  GitHubRepo:
    Type: String
    Description: Repo name (without org prefix), e.g. "lambda-poc".

  AllowedBranch:
    Type: String
    Default: "*"
    Description: Branch filter - use '*' for any branch, or specify branch name like 'main'.

  DeploymentBucket:
    Type: String
    Default: dev-bucket
    Description: S3 bucket the role is allowed to write Lambda artifacts to.

  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >
      Set to "false" if a GitHub OIDC provider already exists in this AWS account

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]
  AllowAllBranches: !Equals [!Ref AllowedBranch, "*"]

Resources:

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # GitHub's OIDC thumbprint (current as of 2023)
      # Can be verified at: https://github.blog/changelog/
      # Or via: openssl s_client -servername token.actions.githubusercontent.com -showcerts -connect token.actions.githubusercontent.com:443
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-lambda-poc-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  # New GitHub OIDC format with numeric IDs (current)
                  - !Sub "repo:${GitHubOrg}@*/${GitHubRepo}@*:*"
                  - !Sub "repo:${GitHubOrg}@*/${GitHubRepo}@*:environment:*"
                  # Old format (without IDs) - for backwards compatibility
                  - !If
                    - AllowAllBranches
                    - !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
                    - !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${AllowedBranch}"
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:*"
      Policies:
        - PolicyName: LambdaPOCPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::${DeploymentBucket}/lambda/code/*"
                  - !Sub "arn:aws:s3:::${DeploymentBucket}/lambda/layers/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${DeploymentBucket}"
                Condition:
                  StringLike:
                    s3:prefix:
                      - "lambda/code/*"
                      - "lambda/layers/*"

Outputs:
  RoleArn:
    Description: Set this as the AWS_DEPLOY_ROLE_ARN GitHub Actions secret.
    Value: !GetAtt GitHubActionsDeployRole.Arn
